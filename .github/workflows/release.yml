name: release

# push a tag like v1.1.0 and this builds every platform and publishes the release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: vet
        run: go vet ./...
      - name: stamp version into the exe details
        run: |
          v="${GITHUB_REF_NAME#v}"
          IFS=. read -r maj min pat <<< "$v"
          cd cmd/quarry
          for a in "-64:amd64" "-arm -64:arm64"; do
            flags="${a%:*}"; arch="${a#*:}"
            go run github.com/josephspurrier/goversioninfo/cmd/goversioninfo@v1.4.1 $flags \
              -ver-major "${maj:-0}" -ver-minor "${min:-0}" -ver-patch "${pat:-0}" \
              -product-ver-major "${maj:-0}" -product-ver-minor "${min:-0}" -product-ver-patch "${pat:-0}" \
              -file-version "$v" -product-version "$v" \
              -o "resource_windows_${arch}.syso" versioninfo.json
          done
      - name: build
        run: |
          mkdir dist
          v="${GITHUB_REF_NAME#v}"
          for t in windows/amd64 linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${t%/*}"; arch="${t#*/}"
            out="dist/quarry_${os}_${arch}"
            [ "$os" = windows ] && out="$out.exe"
            GOOS=$os GOARCH=$arch CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X main.version=$v" -o "$out" ./cmd/quarry
          done
          (cd dist && sha256sum quarry_* > checksums.txt)
      - name: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
